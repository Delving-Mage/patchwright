[project]
name = "patchwright"
version = "0.1.0"
description = "Closed-loop, validated, AI vulnerability remediation"
requires-python = ">=3.10"
dependencies = []   # stdlib-only core; scanners are external binaries

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
patchwright = "patchwright.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
